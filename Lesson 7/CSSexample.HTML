<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CSS Styling Examples</title>
        <!-- Internal CSS -->
         <style>
            h2{
            color: green;
            }
            </style>
            <!-- External CSS-->
            <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <hr>
        <!-- Inline CSS-->
        <h1 style="color: red;">INLINE CSS EXAMPLE</h1>
        <!-- Internal CSS-->
        <h2 >INTERNAL CSS EXAMPLE</h1>
        <!--External CSS-->
        <h3 >EXTERNAL CSS EXAMPLE</h1>
        <hr>
        
        <!-- element selector example -->
         <h4>ELEMANT SELECTOR EXAMPLE</h4>
         <h4>ELEMANT SELECTOR EXAMPLE</h4>
         <hr>

         <!-- group selector example -->
          <h5>GROPE SELECTOR EXAMPLE</h5>
          <p>GROUP SE;ECTOR EXAMPLE</p>
          <hr>
          
    </body>
 </html>
