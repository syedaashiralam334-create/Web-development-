<!DOCTYPE html>
<html>
    <head>
        <title>Fieldset</title>
    </head>
    <body>
        <form>
            <fieldset>
                <!-- The fieldset tag is used to group related elemants in a form and drwas a box around them-->

                 <legend>Personal Information:</legend>
                 <label>Full name:</label>
                 <!--placeholder attributes can be used to provide extra Information about entry to be made-->

                 <input type="text" id="fname" placeholder="Enter Name"><br><br>
                 <label>Email:</label>
                 <input type="text" id="email"><br><br>
                 <label>Gender</label><br>
                 <input type="radio" id="female" name="gender" value="female">Female<br>
                 <input type="radio" id="male" name="gender" value="male">Male<br><br>
                 <label>Birthday:</label>
                 <input type="date" id="birthday" name="birthday"><br><br> 
            </fieldset>
        </form>
    </body>
</html>
