<!DOCTYPE html>
<html>

<head>
    <title>Superhero Academy</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #0d0d1a;
            color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }
        h1 { color: #ffc107; }
        h2 { color: #ffffff; margin-top: 30px; }
        h3 { color: #ffffff; }
        small { color: #aaaaaa; }
        d1 {text-align: left; display: inline-block; }
        dt { color: #ffc107; font-weight: bold; }
        dd { color: #cccccc; }
        hr { border-color: #333333; }
    </style>
    </head>

    <body>

        <h1>Welcome to Superhero Academy!</h1>
        <p>Every hero earns a rank. The bigger the display, the greater the hero!</p>

        <hr>

        <!-- Display Headings -->
         <p class="display-1"> ⭐Legend</p>
         <p class="display-2"> 🔥Champion</p>
         <p class="display-3"> 💪Hero</p>
         <p class="display-4"> 🌱Recruit</p>

         <hr>

         <!-- Small -->
          <h2>Power Dictionary</h2>
          <d1>
            <dt>Thunder Punch</dt>
            <dd>Stuns enemies for 3 seconds.</dd>
            <dt>Turbo dash</dt>
            <dd>Moves at 10px normal speed.</dd>
          </d1>

    </body>
    
</html>
